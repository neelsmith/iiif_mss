h1 { font-size: 1.6rem; }
#controls { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
#controls label { flex: 1 1 18rem; display: flex; flex-direction: column; font-weight: 600; gap: .25rem; }
#controls select { font: inherit; padding: .3rem; width: 100%; }

<body>
<h1>Browse illustrated manuscripts by text</h1>
<p>Choose a text group (an author, for example), then a work, to list the manuscripts with IIIF manifests that contain it. Each manifest links to the IIIF viewer.</p>
<div id="status" role="status"></div>
<div id="controls"></div>
<div id="results" aria-live="polite"></div>
<script>
// ---- cex.js
// Parsing of the composite release file (current.cex).
//
// A release is one text file made of blocks. Each block starts with a label
// line ("#!mss") and runs to the next label line. For data blocks the first
// line is a header. Fields are separated by "|"; a field that starts with a
// double quote is quoted (it may contain "|", and "" is a literal quote),
// matching Python's csv module as used by the biblissima notebooks.
const Cex = (function () {
  "use strict";

  // Split one line into fields.
  function splitLine(line) {
    if (line.indexOf('"') === -1) return line.split("|");
    const fields = [];
    let i = 0;
    const n = line.length;
    for (;;) {
      if (line.charCodeAt(i) === 34 /* " */) {
        let value = "";
        i++;
        for (;;) {
          const close = line.indexOf('"', i);
          if (close === -1) { value += line.slice(i); i = n; break; }
          value += line.slice(i, close);
          if (line.charCodeAt(close + 1) === 34) { value += '"'; i = close + 2; }
          else { i = close + 1; break; }
        }
        // Anything between the closing quote and the next delimiter is kept.
        const bar = line.indexOf("|", i);
        if (bar === -1) { fields.push(value + line.slice(i)); break; }
        fields.push(value + line.slice(i, bar));
        i = bar + 1;
      } else {
        const bar = line.indexOf("|", i);
        if (bar === -1) { fields.push(line.slice(i)); break; }
        fields.push(line.slice(i, bar));
        i = bar + 1;
      }
    }
    return fields;
  }

  // Turn the lines of a data block (header first) into an array of row objects.
  // Extra fields beyond the header are ignored; missing ones are "".
  function parseBlock(lines) {
    if (!lines || lines.length === 0) return [];
    const header = splitLine(lines[0]);
    const rows = [];
    for (let k = 1; k < lines.length; k++) {
      if (lines[k] === "") continue;
      const f = splitLine(lines[k]);
      const row = {};
      for (let c = 0; c < header.length; c++) row[header[c]] = c < f.length ? f[c] : "";
      rows.push(row);
    }
    return rows;
  }

  // Read release text into {block name: lines}.
  function readBlocks(text) {
    const blocks = {};
    let current = null;
    let start = 0;
    const n = text.length;
    while (start <= n) {
      let end = text.indexOf("\n", start);
      if (end === -1) end = n;
      let line = text.slice(start, end);
      if (line.endsWith("\r")) line = line.slice(0, -1);
      start = end + 1;
      if (line.startsWith("#!")) {
        const name = line.slice(2).trim();
        current = blocks[name] || (blocks[name] = []);
      } else if (current === null) {
        if (line.trim() !== "") throw new Error("Data before the first #! label");
      } else {
        current.push(line);
      }
    }
    return blocks;
  }

  // Parse a whole release into {version, mss, texts, textindex}.
  function parseRelease(text) {
    const blocks = readBlocks(text);
    for (const name of ["version", "mss", "texts", "textindex"]) {
      if (!blocks[name]) throw new Error("Release has no #!" + name + " block");
    }
    return {
      version: (blocks.version[0] || "").trim(),
      mss: parseBlock(blocks.mss),
      texts: parseBlock(blocks.texts),
      textindex: parseBlock(blocks.textindex),
    };
  }

  return { splitLine, parseBlock, readBlocks, parseRelease };
})();
if (typeof module !== "undefined") module.exports = Cex;

// ---- browse.js
// Menus and manuscript lists: a port of src/biblissima/browse.py in the
// biblissima repository. Everything works on arrays of plain row objects as
// returned by Cex.parseBlock.
const Browse = (function () {
  "use strict";

  const VIEWER = "https://neelsmith.github.io/iiif-cite/iiif-cite.html#manifest=";
  const PORTAL = "https://portail.biblissima.fr/";
  const NO_COLLECTION = "(none recorded)";
  const ALL = "*all*";

  // Percent-encode, leaving URL punctuation alone (as Python's quote() with
  // the same safe set; encodeURI also leaves letters, digits and -_.~ alone).
  function encodeUrl(s) {
    return encodeURI(s.trim()).replace(/%25/g, "%").replace(/%5B/g, "[").replace(/%5D/g, "]");
  }
  function viewerUrl(manifest) { return VIEWER + encodeUrl(manifest); }
  function portalUrl(ark) { return PORTAL + encodeUrl(ark); }

  function cmp(a, b) { return a < b ? -1 : a > b ? 1 : 0; }
  function fold(s) { return s.toLowerCase(); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
  }

  // {work URN: number of distinct manuscripts}
  function manuscriptCounts(textindex) {
    const found = new Map();
    for (const row of textindex) {
      let set = found.get(row.text);
      if (!set) found.set(row.text, (set = new Set()));
      set.add(row.mss);
    }
    const counts = new Map();
    for (const [urn, set] of found) counts.set(urn, set.size);
    return counts;
  }

  // Menus are arrays of {label, value}.

  function groupOptions(texts) {
    const counts = new Map();
    for (const row of texts) counts.set(row.group, (counts.get(row.group) || 0) + 1);
    return [...counts.entries()]
      .sort((a, b) => cmp(fold(a[0]), fold(b[0])) || cmp(a[0], b[0]))
      .map(([name, n]) => ({ label: name + " (" + plural(n, "work", "works") + ")", value: name }));
  }

  function workOptions(texts, group, counts) {
    const rows = texts
      .filter((r) => r.group === group)
      .sort((a, b) => cmp(fold(a.work), fold(b.work)) || cmp(a.urn, b.urn));
    const seen = new Set();
    const options = [];
    for (const row of rows) {
      const n = counts.get(row.urn) || 0;
      let label = row.work + " (" + n + " MS" + (n === 1 ? "" : "S") + ")";
      if (seen.has(label)) label += " [" + row.urn + "]";
      seen.add(label);
      options.push({ label, value: row.urn });
    }
    return options;
  }

  function addManifest(entry, row) {
    const url = row.manifest.trim();
    if (url && !entry.manifests.includes(url)) entry.manifests.push(url);
  }

  // Manuscripts containing a work, sorted by collection then label.
  function manuscriptsForWork(urn, textindex, mss) {
    const locations = new Map();
    for (const row of textindex) {
      if (row.text !== urn) continue;
      let locs = locations.get(row.mss);
      if (!locs) locations.set(row.mss, (locs = []));
      if (row.location && !locs.includes(row.location)) locs.push(row.location);
    }
    const entries = new Map();
    for (const row of mss) {
      const ark = row.biblissima;
      if (!locations.has(ark)) continue;
      let entry = entries.get(ark);
      if (!entry) {
        entry = { ark, label: row.label, collection: row.collection || "",
                  locations: locations.get(ark), manifests: [] };
        entries.set(ark, entry);
      }
      addManifest(entry, row);
    }
    return [...entries.values()].sort(
      (a, b) => cmp(fold(a.collection), fold(b.collection)) || cmp(fold(a.label), fold(b.label)));
  }

  // {manuscript ark: collection}; a blank collection becomes NO_COLLECTION.
  function manuscriptCollections(mss) {
    const found = new Map();
    for (const row of mss) {
      if (!found.has(row.biblissima)) found.set(row.biblissima, row.collection || NO_COLLECTION);
    }
    return found;
  }

  // {work URN: "group - work"}
  function textNames(texts) {
    const names = new Map();
    for (const row of texts) {
      if (!names.has(row.urn)) names.set(row.urn, row.group + " - " + row.work);
    }
    return names;
  }

  // Collections that hold manuscripts with indexed texts.
  function collectionOptions(textindex, holders) {
    const arks = new Map();
    for (const row of textindex) {
      const collection = holders.get(row.mss);
      if (collection === undefined) continue;
      let set = arks.get(collection);
      if (!set) arks.set(collection, (set = new Set()));
      set.add(row.mss);
    }
    return [...arks.entries()]
      .sort((a, b) => cmp(fold(a[0]), fold(b[0])) || cmp(a[0], b[0]))
      .map(([name, set]) => ({ label: name + " (" + plural(set.size, "MS", "MSS") + ")", value: name }));
  }

  // Works found in a collection; the first entry is "All".
  function collectionWorkOptions(collection, textindex, texts, holders) {
    const names = textNames(texts);
    const perWork = new Map();
    for (const row of textindex) {
      if (holders.get(row.mss) !== collection) continue;
      let set = perWork.get(row.text);
      if (!set) perWork.set(row.text, (set = new Set()));
      set.add(row.mss);
    }
    const allArks = new Set();
    for (const set of perWork.values()) for (const a of set) allArks.add(a);
    const options = [{
      label: "All (" + plural(perWork.size, "work", "works") + " in " +
        plural(allArks.size, "manuscript", "manuscripts") + ")",
      value: ALL,
    }];
    const seen = new Set([options[0].label]);
    const name = (u) => names.get(u) || u;
    const sorted = [...perWork.entries()].sort(
      (a, b) => cmp(fold(name(a[0])), fold(name(b[0]))) || cmp(a[0], b[0]));
    for (const [urn, set] of sorted) {
      let label = name(urn) + " (" + plural(set.size, "MS", "MSS") + ")";
      if (seen.has(label)) label += " [" + urn + "]";
      seen.add(label);
      options.push({ label, value: urn });
    }
    return options;
  }

  // Manuscripts of a collection with one work, or with every work (ALL).
  function entriesForCollection(collection, selection, textindex, texts, mss) {
    const holders = manuscriptCollections(mss);
    const names = textNames(texts);
    const found = new Map(); // ark -> Map(urn -> locations)
    for (const row of textindex) {
      const ark = row.mss;
      if (holders.get(ark) !== collection) continue;
      if (selection !== ALL && row.text !== selection) continue;
      let per = found.get(ark);
      if (!per) found.set(ark, (per = new Map()));
      let locs = per.get(row.text);
      if (!locs) per.set(row.text, (locs = []));
      if (row.location && !locs.includes(row.location)) locs.push(row.location);
    }
    const entries = new Map();
    for (const row of mss) {
      const ark = row.biblissima;
      if (!found.has(ark)) continue;
      let entry = entries.get(ark);
      if (!entry) {
        const per = found.get(ark);
        entry = { ark, label: row.label, collection: "", manifests: [] };
        if (selection === ALL) {
          entry.works = [...per.entries()]
            .map(([u, locs]) => [names.get(u) || u, locs])
            .sort((a, b) => cmp(fold(a[0]), fold(b[0])));
        } else {
          entry.locations = per.get(selection);
        }
        entries.set(ark, entry);
      }
      addManifest(entry, row);
    }
    return [...entries.values()].sort((a, b) => cmp(fold(a.label), fold(b.label)));
  }

  // HTML list of manuscripts (classes are styled by the page stylesheet).
  function renderManuscriptsHtml(entries) {
    const items = entries.map((e) => {
      const many = e.manifests.length > 1;
      const portal = '<a class="btn" href="' + esc(portalUrl(e.ark)) +
        '" target="_blank" rel="noopener">View Biblissima &#9656;</a>';
      const links = e.manifests.map((m, i) =>
        '<a class="btn" href="' + esc(viewerUrl(m)) + '" target="_blank" rel="noopener">' +
        "View images" + (many ? " " + (i + 1) : "") + " &#9656;</a>").join("");
      const details = [];
      if (e.collection) details.push(esc(e.collection));
      if (e.locations && e.locations.length) details.push("location: " + esc(e.locations.join("; ")));
      let meta = details.length ? "<div>" + details.join(" &middot; ") + "</div>" : "";
      for (const [name, locs] of e.works || []) {
        meta += "<div>" + esc(name) + (locs.length ? " &mdash; " + esc(locs.join("; ")) : "") + "</div>";
      }
      return "<li><strong>" + esc(e.label) + "</strong>" + meta + "<div>" + portal + links + "</div></li>";
    });
    return "<ul>" + items.join("") + "</ul>";
  }

  return {
    VIEWER, PORTAL, NO_COLLECTION, ALL, viewerUrl, portalUrl, esc,
    manuscriptCounts, groupOptions, workOptions, manuscriptsForWork,
    manuscriptCollections, textNames, collectionOptions, collectionWorkOptions,
    entriesForCollection, renderManuscriptsHtml,
  };
})();
if (typeof module !== "undefined") module.exports = Browse;

// ---- loader.js
// Fetching and loading the release file. Works from a web server or from a
// local file (file://): it needs no module imports and only fetch().
const Loader = (function () {
  "use strict";

  const DEFAULT_URL =
    "https://raw.githubusercontent.com/neelsmith/biblissima/refs/heads/main/datareleases/current.cex";

  // The data location can be overridden with ?data=<url> (used by tests).
  function dataUrl(search) {
    const value = new URLSearchParams(search || "").get("data");
    return value || DEFAULT_URL;
  }

  // Fetch a text file, reporting progress as the bytes arrive.
  async function fetchText(url, onProgress) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("HTTP " + resp.status + " fetching " + url);
    if (!resp.body || !resp.body.getReader) return await resp.text();
    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let text = "";
    let bytes = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      bytes += value.length;
      text += decoder.decode(value, { stream: true });
      if (onProgress) onProgress(bytes);
    }
    return text + decoder.decode();
  }

  // Fetch and parse the release. onStatus receives short progress messages.
  async function loadRelease(url, onStatus) {
    const say = onStatus || function () {};
    say("Loading data…");
    const text = await fetchText(url, function (bytes) {
      say("Loading data… " + (bytes / 1048576).toFixed(1) + " MB");
    });
    say("Reading data…");
    // Let the browser paint the message before the (synchronous) parse.
    await new Promise(function (r) { setTimeout(r, 0); });
    return Cex.parseRelease(text);
  }

  return { DEFAULT_URL, dataUrl, fetchText, loadRelease };
})();
if (typeof module !== "undefined") module.exports = Loader;

// ---- pages/ui.js
// Small DOM helpers shared by both pages.
const Ui = (function () {
  "use strict";

  function setStatus(message, isError) {
    const el = document.getElementById("status");
    el.textContent = message || "";
    el.className = isError ? "error" : "";
  }

  // A labelled <select> with a placeholder first option; options are
  // [{label, value}]. Returns {wrapper, select}.
  function makeSelect(labelText, placeholder, options) {
    const wrapper = document.createElement("label");
    wrapper.appendChild(document.createTextNode(labelText));
    const select = document.createElement("select");
    const first = document.createElement("option");
    first.value = "";
    first.textContent = placeholder;
    select.appendChild(first);
    options.forEach(function (o, i) {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = o.label;
      select.appendChild(opt);
    });
    wrapper.appendChild(select);
    return { wrapper: wrapper, select: select };
  }

  // The option chosen in a select made by makeSelect, or null.
  function chosen(select, options) {
    return select.value === "" ? null : options[Number(select.value)];
  }

  function showResults(headingText, entries) {
    const el = document.getElementById("results");
    el.innerHTML = "<h3>" + Browse.esc(headingText) + "</h3>" + Browse.renderManuscriptsHtml(entries);
  }

  function showMessage(text) {
    const el = document.getElementById("results");
    el.innerHTML = "<p><em>" + Browse.esc(text) + "</em></p>";
  }

  function clearResults() { document.getElementById("results").innerHTML = ""; }

  return { setStatus, makeSelect, chosen, showResults, showMessage, clearResults };
})();
if (typeof module !== "undefined") module.exports = Ui;

// ---- pages/texts.js
// browsetexts.html: choose a text group, then a work; list the manuscripts.
(function () {
  "use strict";

  function start(data) {
    const counts = Browse.manuscriptCounts(data.textindex);
    const groups = Browse.groupOptions(data.texts);
    const controls = document.getElementById("controls");

    const groupMenu = Ui.makeSelect("Text group (release " + data.version + ")", "Choose a text group…", groups);
    controls.appendChild(groupMenu.wrapper);
    const workSlot = document.createElement("div");
    workSlot.style.flex = "1 1 18rem";
    controls.appendChild(workSlot);

    let workOptions = [];
    let workMenu = null;

    function showWork() {
      const group = Ui.chosen(groupMenu.select, groups);
      const work = workMenu && Ui.chosen(workMenu.select, workOptions);
      if (!group) { Ui.clearResults(); return; }
      if (!work) { Ui.showMessage("Choose a work."); return; }
      const entries = Browse.manuscriptsForWork(work.value, data.textindex, data.mss);
      if (entries.length === 0) {
        Ui.showMessage("No manuscripts with IIIF manifests are recorded for " + work.value + ".");
        return;
      }
      Ui.showResults(entries.length + " manuscript" + (entries.length === 1 ? "" : "s") +
        " containing " + work.value, entries);
    }

    groupMenu.select.addEventListener("change", function () {
      workSlot.textContent = "";
      workMenu = null;
      workOptions = [];
      const group = Ui.chosen(groupMenu.select, groups);
      if (group) {
        workOptions = Browse.workOptions(data.texts, group.value, counts);
        workMenu = Ui.makeSelect("Work in " + group.value, "Choose a work…", workOptions);
        workMenu.select.addEventListener("change", showWork);
        workSlot.appendChild(workMenu.wrapper);
      }
      showWork();
    });
  }

  Loader.loadRelease(Loader.dataUrl(location.search), Ui.setStatus)
    .then(function (data) { Ui.setStatus(""); start(data); })
    .catch(function (err) {
      Ui.setStatus("Could not load the data: " + err.message, true);
    });
})();

</script>
